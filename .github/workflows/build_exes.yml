name: Build Nikunja Bazaar RPG (Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"
  EXE_NAME: "NikunjaBazaar.exe"

jobs:
  build:
    name: Test + export Windows .exe
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-$env:GODOT_RELEASE"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-$env:GODOT_RELEASE`_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath "$env:RUNNER_TEMP\godot" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\godot" -Filter "*_console.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Godot console executable not found" }
          "GODOT=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe.FullName --version

      - name: Install Windows export templates
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-$env:GODOT_RELEASE"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-$env:GODOT_RELEASE`_export_templates.tpz" -OutFile templates.zip
          Expand-Archive templates.zip -DestinationPath "$env:RUNNER_TEMP\tpl" -Force
          $dst = Join-Path $env:APPDATA "Godot\export_templates\$env:GODOT_VERSION.$env:GODOT_RELEASE"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$env:RUNNER_TEMP\tpl\templates\version.txt" $dst
          Copy-Item "$env:RUNNER_TEMP\tpl\templates\windows_*_x86_64*.exe" $dst

      - name: Import project
        run: |
          & $env:GODOT --headless --path . --import 2>&1 | Out-Host

      - name: Headless tests
        run: |
          $tests = @(
            @{ Scene = "CityTest"; Pass = '\[CITY2D\] PASS' },
            @{ Scene = "EconomyTest"; Pass = '\[ECON\] PASS' },
            @{ Scene = "DayTest"; Pass = '\[DAY\] PASS' }
          )
          foreach ($t in $tests) {
            if ($t.Scene -eq "DayTest") { $env:DAY = "15" }
            $log = "$($t.Scene).log"
            & $env:GODOT --headless --path . "res://tools/test/$($t.Scene).tscn" *> $log
            $code = $LASTEXITCODE
            Write-Output "--- $($t.Scene) (exit $code) ---"
            Select-String -Path $log -Pattern '\[CITY2D\]|\[ECON\]|\[DAY\]|SCRIPT ERROR|Parse Error' |
              ForEach-Object { $_.Line } | Out-Host
            if ($code -ne 0) { throw "$($t.Scene) exited with $code" }
            if (-not (Select-String -Path $log -Pattern $t.Pass -Quiet)) { throw "$($t.Scene) did not print PASS" }
          }
          "Headless tests passed"
          exit 0

      - name: Export Windows release
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $env:GODOT --headless --path . --export-release "Windows Desktop" "build\$env:EXE_NAME" 2>&1 | Out-Host
          if (-not (Test-Path "build\$env:EXE_NAME")) { throw "Export failed" }
          Get-Item "build\$env:EXE_NAME" | Select-Object Name,Length

      - name: Copy docs into artifact
        run: |
          Copy-Item README.md build\
          New-Item -ItemType Directory -Force -Path build\docs | Out-Null
          Copy-Item docs\* build\docs\ -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikunjaBazaar-Windows
          path: build/
          if-no-files-found: error
          retention-days: 30

      - name: Attach .exe to tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --title $tag --notes "Automated Windows build from GitHub Actions"
          }
          gh release upload $tag "build\$env:EXE_NAME" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
